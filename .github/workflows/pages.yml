name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Reuse published offline assets
        run: |
          set -e
          mkdir -p dist/data dist/audio
          base="https://geertvdhoek-zdhc.github.io/sevilla-walking-guide"
          for f in map.geojson route.geojson; do
            curl --fail --location --retry 3 "$base/data/$f" -o "dist/data/$f"
            test -s "dist/data/$f"
          done
          for f in 01-alameda 02-feria 03-san-luis 04-pumarejo 05-macarena 06-muralla 07-derivado; do
            curl --fail --location --retry 3 "$base/audio/$f.mp3" -o "dist/audio/$f.mp3"
            test -s "dist/audio/$f.mp3"
          done
      - name: Build offline guide
        run: npm run build
      - name: Validate required assets
        run: |
          set -e
          test -s dist/data/map.geojson
          test -s dist/data/route.geojson
          test -s dist/data/stops.json
          for f in dist/audio/*.mp3; do test -s "$f"; done
          test "$(find dist/audio -name '*.mp3' | wc -l)" -eq 7
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4